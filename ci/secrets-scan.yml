secrets-scan:
  stage: code-scan
  tags:
    - shell
    - linux
    - local
  script:
    - echo "Secrets scan (gitleaks)"
    - gitleaks version
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --exit-code 0
    - echo "Secrets scan завершен, отчет сохранен"
  artifacts:
    paths:
      - gitleaks-report.json
    expire_in: 1 week
    when: always
